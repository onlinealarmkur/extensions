name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please [search the existing issues](https://github.com/onlinealarmkur/extensions/issues?q=is%3Aissue) first.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Opera
        - Firefox
        - Other Chromium browser (write the name below)
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version and operating system
      placeholder: Chrome 151 on Windows 11
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown at the bottom of the popup.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: One action per line.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: dropdown
    id: browser-open
    attributes:
      label: Was the browser open at the alarm or timer time?
      options:
        - "Yes, the browser was open"
        - "No, I saw the problem after I opened the browser again"
        - "I do not know"
        - "Not related to an alarm or timer"
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: If the problem is visual, drag an image into this field.
